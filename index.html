<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<title>منصة المهندس حسين علام للفيزياء</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.4"></script>
<style type="text/tailwindcss">
@import "tailwindcss";

@layer base {
  :root {
    --font-cairo: 'Cairo', 'IBM Plex Sans Arabic', 'Tajawal', system-ui, sans-serif;
  }
}

html, body {
  font-family: var(--font-cairo);
  letter-spacing: normal !important;
  text-rendering: optimizeLegibility;
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3, h4, h5, h6, .font-display {
  font-family: var(--font-cairo);
  letter-spacing: normal !important;
  line-height: 1.4;
}

/* Prevent clipping of Arabic letter dots (ن، ت، ث، ي، ق، ف، ش، ض) */
span, p, h1, h2, h3, h4, a, button, input, textarea, select {
  overflow-wrap: break-word;
}

/* Blueprint Grid Background */
.blueprint-grid {
  background-image: 
    linear-gradient(to right, rgba(14, 165, 233, 0.07) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(14, 165, 233, 0.07) 1px, transparent 1px);
  background-size: 32px 32px;
}

.blueprint-grid-dark {
  background-image: 
    linear-gradient(to right, rgba(232, 135, 30, 0.09) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(232, 135, 30, 0.09) 1px, transparent 1px);
  background-size: 32px 32px;
}

/* Custom Scrollbar */
::-webkit-scrollbar {
  width: 7px;
  height: 7px;
}

::-webkit-scrollbar-track {
  background: transparent;
}

::-webkit-scrollbar-thumb {
  background: rgba(148, 163, 184, 0.4);
  border-radius: 9999px;
}

::-webkit-scrollbar-thumb:hover {
  background: rgba(232, 135, 30, 0.6);
}

@keyframes spin-slow {
  from {
    transform: rotate(0deg);
  }
  to {
    transform: rotate(360deg);
  }
}

.animate-spin-slow {
  animation: spin-slow 20s linear infinite;
}

</style>
<style>
:root { color-scheme: dark; box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); background: #020617; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body { background: #020617; color: #f1f5f9; margin: 0; }
#boot-error { white-space: pre-wrap; direction: ltr; font: 12px monospace; color: #fca5a5; padding: 16px; }
</style>
</head>
<body class="bg-slate-950 text-slate-100 antialiased font-sans">
<div id="root"></div>
<script>
window.addEventListener('error', function (e) {
  var r = document.getElementById('root');
  if (r && !r.children.length) { r.innerHTML = '<div id="boot-error"></div>'; document.getElementById('boot-error').textContent = 'Error: ' + e.message; }
});
</script>
